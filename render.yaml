# Render Blueprint: web service (Dockerfile) + managed Postgres.
# Render does not run docker-compose.yml. Same image, hosted Postgres instead.
# Dashboard: New + Blueprint → this repo.

services:
  - type: web
    name: bookstore-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookstore-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: bookstore-db
    plan: free
    databaseName: bookstore
    user: bookstore
